# Nginx reverse proxy for Guess The Song.
# Copies to /etc/nginx/sites-available/songguess
#
# Key detail: Socket.io needs the Upgrade/Connection headers, and a long
# proxy_read_timeout so long-lived game sockets are not cut off.

server {
    listen 80;
    listen [::]:80;

    # Put your domain here once you have one, e.g.  server_name song.example.com;
    server_name _;

    # Allow reasonably large uploads (not really needed, but harmless).
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # --- WebSocket upgrade (required for Socket.io) ---
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep game sockets alive for a long time.
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
